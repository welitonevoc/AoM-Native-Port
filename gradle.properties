#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Sun Nov 01 15:37:07 GMT 2026
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -XX\:MaxMetaspaceSize\=512m -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8

# AAPT2 nativo (arm64) do Termux; o binário x86_64 do AGP não roda no aparelho.
android.aapt2FromMavenOverride=/data/data/com.termux/files/home/android-tools/bin/aapt2
