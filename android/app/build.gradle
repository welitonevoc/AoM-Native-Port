plugins {
    id "com.android.application"
}

def nativeJniDir = file("$buildDir/generated/jniLibs")
def nativeSo = file("${rootDir}/build-m2/libaom_native.so")
def libcxxSo = file("${rootDir}/tools/lib/libc++_shared.so")

android {
    namespace "com.aom.nativeport"
    compileSdk 34

    defaultConfig {
        applicationId "com.aom.nativeport"
        minSdk 24
        targetSdk 34
        versionCode 1793531765
        versionName "1.0.11010816"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
            jniLibs.srcDirs = [nativeJniDir]
        }
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ["**/*.so"]
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable true
        }
    }
}

// O NDK oficial é linux-x86_64 e não executa neste Android ARM64. O Gradle
// orquestra o build e reaproveita o pipeline nativo validado no dispositivo.
def termuxPrefix = System.getenv("PREFIX")
if (!termuxPrefix || !new File(termuxPrefix, "bin/clang++").canExecute()) {
    termuxPrefix = "/data/data/com.termux/files/usr"
}

tasks.register("buildNative", Exec) {
    workingDir rootDir
    environment "PREFIX", termuxPrefix
    environment "TERMUX__PREFIX", termuxPrefix
    environment "TMPDIR", "${termuxPrefix}/tmp"
    environment "LD_LIBRARY_PATH", "${termuxPrefix}/lib"
    environment "PATH", "${termuxPrefix}/bin:${System.getenv("PATH") ?: "/system/bin"}"
    commandLine "bash", "scripts/build_native.sh"
}

tasks.register("copyNativeLibs", Copy) {
    dependsOn "buildNative"
    from(nativeSo) { into "arm64-v8a" }
    from(libcxxSo) { into "arm64-v8a" }
    into nativeJniDir
}

tasks.named("preBuild") { dependsOn "copyNativeLibs" }

