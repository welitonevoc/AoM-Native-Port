plugins {
    id "com.android.application"
}

android {
    namespace "com.aom.nativeport"
    compileSdk 34

    defaultConfig {
        applicationId "com.aom.nativeport"
        minSdk 24
        targetSdk 34
        versionCode 1793531765
        versionName "1.0.11010816"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DBUILD_TESTING=OFF"
            }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['../../assets']
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

